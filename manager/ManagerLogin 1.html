
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorLink | Manager Login</title>
</head>
<body>
  <header>
    <h1>TutorLink</h1>
    <p>Manager Portal</p>
    <hr>
  </header>

  <main>
    <h2>Manager Login</h2>

    <form action="manager-dashboard.html" method="get">
      <p>
        <label for="email">Manager email address:</label><br>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required>
      </p>

      <p>
        <button type="submit">Login</button>
      </p>
    </form>

    <p>
      Don't have an account?
      <a href="manager-register.html">Register as a manager</a>
    </p>

    <p>
      <small>
        HTML prototype only. Real manager login and password
        verification will be added with PHP later.
      </small>
    </p>
  </main>

  <footer>
    <hr>
    <p>&copy; 2026 TutorLink</p>
  </footer>
</body>
</html>
