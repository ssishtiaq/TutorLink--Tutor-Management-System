<head>

<body>
  <header>
    <h1>TutorLink</h1>
    <p>Student Portal</p>
    <hr>
  </header>

  <main>
    <h2>Student Login</h2>
    <form action="index.html" method="get">
      <p><label for="email">Email address:</label><br><input type="email" id="email" name="email" required></p>
      <p><label for="password">Password:</label><br><input type="password" id="password" name="password" required></p>
      <p><button type="submit">Login</button></p>
    </form>
    <p>Don't have an account? <a href="student-register.html">Register as a student</a></p>
  </main>
